name: Quality checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --project backend --locked --group dev
      - run: uv run --project backend ruff check backend/app backend/tests backend/scripts
      - run: uv run --project backend pytest backend/tests -q
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: node scripts/uk-release-guard.mjs
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix frontend run lint:uk
      - run: npm --prefix frontend test
      - run: npm run test:uk
      - run: npx playwright test claim-message marketplace-selection portal-access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uk-browser-evidence
          path: docs/uk/evidence
